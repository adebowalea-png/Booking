<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirmation — Single</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body class="conf-body" style="padding-bottom: 80px;">

<div class="conf-header">
  <span class="conf-logo">Preply</span>
</div>

<div class="conf-content">
  <div class="conf-section">
    <div class="conf-avatar"><img src="https://randomuser.me/api/portraits/men/32.jpg" alt="Jonathan" /></div>
    <div class="conf-text">
      <h1 class="conf-heading">Your next lesson is booked.</h1>
      <div class="conf-lesson-info">
        <p class="conf-tutor-name">English with Jonathan</p>
        <div class="conf-schedule">
          <p>Fri, May 30, 14:00 – 14:50</p>
        </div>
      </div>
    </div>
    <button class="btn-add-calendar">
      Add to calendar
    </button>
  </div>
  <button class="btn-on-color">Continue</button>
</div>

<script>lucide.createIcons();</script>
<script>
  (function() {
    var params = new URLSearchParams(location.search);
    var slots = params.getAll('slot');
    var schedEl = document.querySelector('.conf-schedule');
    if (slots.length && schedEl) {
      var heading = document.querySelector('.conf-heading');
      if (slots.length > 1) {
        if (heading) heading.textContent = 'Your next lessons are booked.';
        schedEl.innerHTML = slots.map(function(s) { return '<p>\u2022 ' + s + '</p>'; }).join('');
      } else {
        schedEl.innerHTML = '<p>' + slots[0] + '</p>';
      }
    }
    document.querySelector('.btn-on-color').addEventListener('click', function() {
      window.location.href = '../vision/my-lessons-vision.html';
    });
  })();
</script>
</body>
</html>
